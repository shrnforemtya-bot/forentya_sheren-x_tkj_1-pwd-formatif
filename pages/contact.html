<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hubungi Saya</title>

    <style>
      body {
        background-color: #fffcf6;
        font-family: Arial, Helvetica, sans-serif;
      }

      #contact {
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .contact-form {
        width: 400px;
        padding: 24px;
        border: 1px solid #557fa9;
        background-color: white;
        border-radius: 30px;
        box-shadow: 10px 15px #71a8df32;
      }

      .contact-form h2 {
        text-align: center;
        color: #284f76;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #aab8c5;
        border-radius: 8px;
        font-size: 14px;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #557fa9;
        background-color: #eaf2f8;
      }

      .form-group textarea {
        height: 150px;
      }

      .form-group textarea:focus {
        border-color: #d8c262;
        background-color: #fcfaf3;
      }

      .btn-submit {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        background-color: #557fa9;
        color: white;
        font-weight: bold;
      }

      .btn-submit:hover {
        background-color: #2c3e50;
      }

      footer {
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <section id="contact">
      <form action="" class="contact-form">
        <h2>Hubungi Saya</h2>
        <div class="form-group">
          <label for="nama">Nama</label>
          <input type="text" id="nama" name="nama" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
        </div>
        <div class="form-group">
          <label for="pesan">Pesan</label>
          <textarea name="pesan" id="pesan"></textarea>
        </div>
        <button class="btn-submit">Kirim Pesan</button>
      </form>
    </section>
    <footer>
      <a href="../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
