<!doctype html>
<!-- Tanpa box-sizing: lebar kartu = 320 
     320 + 40 (padding kiri kanan) = 360
     360 + 4 (border kiri kanan) = 364px -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Card</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: #fffcf6;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        display: flex;
        justify-content: center;
      }

      .card {
        width: 320px;
        padding: 20px;
        border: 2px solid #557fa9;
        border-radius: 12px;
        margin: 30px 0;
        background-color: white;
      }

      .card img {
        width: 100%;
        height: 160px;
        display: block;
        object-fit: cover;
      }

      .card h3 {
        color: #2c3e50;
        margin: 12px 0 8px 0;
      }

      .card p,
      .card a {
        font-size: 15px;
      }

      .card p {
        color: #444444;
      }

      .card a {
        color: #557fa9;
        font-weight: bold;
      }

      footer {
        display: flex;
        justify-content: center;
      }

      footer a {
        padding: 12px 28px;
        border: 2px solid #557fa9;
        border-radius: 30px;
        background-color: #ccdbe7;
        color: #1e3457;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header></header>
    <main>
      <div class="card">
        <img src="../assets/images/card.png" alt="gambar proyek" />
        <h3>Web Page About Me</h3>
        <p>
          Website pribadi ini saya buat dengan HTML dan CSS atas tugas
          pembelajaran pemrograman web dasar. Website ini saya gunakan untuk
          memperkenalkan diri dan melatih keterampilan saya.
        </p>
        <a href="../pages/about.html">Lihat Proyek</a>
      </div>
    </main>
    <footer>
      <a href="../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
