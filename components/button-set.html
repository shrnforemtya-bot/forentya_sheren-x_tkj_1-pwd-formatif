<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button-Set</title>
    <style>
      body {
        background-color: #fffcf6;
        font-family: Arial, sans-serif;
        padding: 10px 20px;
      }

      h2 {
        color: #2c3e50;
        font-size: 20px;
        font-weight: bold;
        margin: 20px 0px 20px 10px;
      }

      .btn {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
      }

      .button-group {
        width: 640px;
        padding: 24px 10px 14px 24px;
        background-color: white;
        border: 4px solid #cfdbe5;
        border-radius: 10px;
      }

      .button-group .btn {
        margin-right: 10px;
        margin-bottom: 10px;
      }

      .btn-primary {
        background-color: rgb(108, 158, 202);
        color: white;
        border: 2px solid transparent;
      }

      .btn-secondary {
        background-color: #fbf1e2;
        border: 2px solid #dccfb9;
      }

      .btn-outline {
        background-color: white;
        border: 2px solid #629fd4;
      }

      .btn-send {
        background-color: #38516a;
        color: #f8f5ef;
        border: 2px solid transparent;
      }

      .btn-secondary,
      .btn-outline {
        color: #2c3e50;
      }

      .btn-primary:hover {
        background-color: rgb(58, 99, 137);
      }

      .btn-secondary:hover {
        background-color: #dccfb9;
      }

      .btn-outline:hover {
        background-color: rgba(74, 123, 167, 0.15);
      }

      .btn-send:hover {
        background-color: rgba(29, 62, 97, 0.8);
      }

      footer a {
        display: inline-block;
        margin-top: 20px;
        margin-left: 5px;
        background: #edf1f7;
        border: 2px solid #73a6d2;
        padding: 12px;
        border-radius: 15px;
        color: #4a7ba7;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header></header>
    <main>
      <h2>Navigasi</h2>

      <div class="button-group">
        <a href="" class="btn btn-primary">Lihat Proyek</a>
        <a href="" class="btn btn-secondary">Unduh CV</a>
        <a href="" class="btn btn-outline">Hubungi Saya</a>
        <a href="" class="btn btn-send">Kirim Pesan</a>
      </div>
    </main>
    <footer>
      <a href="../index.html"> Kembali ke Beranda</a>
    </footer>
  </body>
</html>
